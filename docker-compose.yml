# ============================================================
# scanota docker-compose.yml
# Services: db (Phase 1), api (Phase 2), dashboard (Phase 10)
# ============================================================

volumes:
  pgdata:
  storage:

services:

  # ----------------------------------------------------------
  # db: PostgreSQL 16 with schema init
  # ----------------------------------------------------------
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER:      ${POSTGRES_USER}
      POSTGRES_PASSWORD:  ${POSTGRES_PASSWORD}
      POSTGRES_DB:        ${POSTGRES_DB}
      POSTGRES_RO_PASSWORD: ${POSTGRES_RO_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./app/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./app/db/init/02-roles.sh:/docker-entrypoint-initdb.d/02-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    # Postgres is bound to 127.0.0.1, so it is reachable from this machine only (psql, an SSH
    # tunnel) and never from the network. The api and dashboard reach it as db:5432 inside the
    # compose network. POSTGRES_PORT fixes the local port; empty lets Docker pick one.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-}:5432"

  # ----------------------------------------------------------
  # api: FastAPI backend (added in Phase 2)
  # ----------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: app/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL:          ${DATABASE_URL}
      DATABASE_READONLY_URL: ${DATABASE_READONLY_URL}
      STORAGE_DIR:           /srv/storage
    volumes:
      - storage:/srv/storage
      # Sample data for `make demo-data` (python -m app.db.seed reads data/ relative to /srv/app)
      - ./data:/srv/app/data:ro
    # Bound to 127.0.0.1: only a reverse proxy on this machine (or you, over an SSH tunnel) can reach it.
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # ----------------------------------------------------------
  # dashboard: Streamlit UI (added in Phase 10)
  # ----------------------------------------------------------
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      API_BASE_URL: http://api:8000
    # Bound to 127.0.0.1, like the api: put a reverse proxy with HTTPS in front (see README).
    ports:
      - "127.0.0.1:8501:8501"
    depends_on:
      - api
