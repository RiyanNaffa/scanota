[theme]
base = "dark"
primaryColor = "#a7d129"
backgroundColor = "#000000"
secondaryBackgroundColor = "#3e432e"
textColor = "#f1f5e4"
font = "sans serif"

[client]
# "viewer" hides the Deploy button and the developer menu entries (the app runs on its own VM)
toolbarMode = "viewer"

[browser]
gatherUsageStats = false
